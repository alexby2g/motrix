services:
  - type: web
    name: motrix-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: MOTRIX
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: '#^https://.*\.vercel\.app$#'
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: motrix
      - key: REVERB_APP_KEY
        value: motrix-prod-key
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        fromService:
          type: web
          name: motrix-reverb
          property: host
      - key: REVERB_PORT
        fromService:
          type: web
          name: motrix-reverb
          property: port
      - key: REVERB_SCHEME
        value: http

  - type: web
    name: motrix-reverb
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c 'php artisan reverb:start --host=0.0.0.0 --port=${PORT:-10000}'
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: MOTRIX-Reverb
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: motrix
      - key: REVERB_APP_KEY
        value: motrix-prod-key
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
