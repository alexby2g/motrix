name: MOTRIX - APK de pruebas independiente

on:
  pull_request:
    branches:
      - oficial-motrix-v1-20261105
    paths:
      - 'frontend/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motrix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    name: Compilar MOTRIX Pruebas APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Obtener codigo de la rama de pruebas
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Quasar
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Instalar Capacitor
        working-directory: frontend/src-capacitor
        run: npm ci --no-audit --no-fund

      - name: Preparar Firebase para paquete de pruebas sin modificar produccion
        shell: bash
        env:
          FIREBASE_JSON_B64: ${{ secrets.MOTRIX_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          python3 - <<'PY'
          import base64
          import copy
          import json
          import os
          from pathlib import Path

          encoded = os.environ.get('FIREBASE_JSON_B64', '')
          if not encoded:
              raise SystemExit('Falta el secreto MOTRIX_GOOGLE_SERVICES_JSON_B64 para compilar Android')

          config = json.loads(base64.b64decode(encoded).decode('utf-8'))
          original = 'bo.edu.josecastillo.motrix'
          preview = original + '.preview'
          clientes = config.get('client', [])
          cliente_original = next(
              (c for c in clientes if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == original),
              None,
          )
          if cliente_original is None:
              raise SystemExit('El secreto Firebase no contiene el paquete oficial MOTRIX')

          cliente_preview = copy.deepcopy(cliente_original)
          cliente_preview['client_info']['android_client_info']['package_name'] = preview
          # El archivo se crea solo en el runner y no se guarda en GitHub.
          config['client'] = [cliente_preview]
          destino = Path('frontend/src-capacitor/android/app/google-services.json')
          destino.parent.mkdir(parents=True, exist_ok=True)
          destino.write_text(json.dumps(config), encoding='utf-8')
          print('Configuracion Android de prueba preparada; no se ha modificado Firebase remoto')
          PY

      - name: Compilar interfaz movil y sincronizar Capacitor
        working-directory: frontend
        env:
          VITE_API_URL: https://backend.motrixbolivia.com/api
          VITE_REVERB_HOST: backend.motrixbolivia.com
        run: npx quasar build -m capacitor -T android --skip-pkg

      - name: Separar la APK de la version oficial
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('frontend/src-capacitor/android/app/build.gradle')
          texto = gradle.read_text(encoding='utf-8')
          marcador = '    buildTypes {'
          if texto.count(marcador) != 1:
              raise SystemExit('No se encontro el bloque buildTypes esperado')
          texto = texto.replace(
              marcador,
              marcador + '\n        debug {\n            applicationIdSuffix ".preview"\n            versionNameSuffix "-pruebas"\n        }',
              1,
          )
          gradle.write_text(texto, encoding='utf-8')

          strings = Path('frontend/src-capacitor/android/app/src/main/res/values/strings.xml')
          texto = strings.read_text(encoding='utf-8')
          if '<string name="app_name">MOTRIX</string>' not in texto:
              raise SystemExit('No se encontro el nombre de app esperado')
          texto = texto.replace(
              '<string name="app_name">MOTRIX</string>',
              '<string name="app_name">MOTRIX Pruebas</string>',
              1,
          )
          texto = texto.replace(
              '<string name="title_activity_main">MOTRIX</string>',
              '<string name="title_activity_main">MOTRIX Pruebas</string>',
              1,
          )
          strings.write_text(texto, encoding='utf-8')
          print('Paquete independiente: bo.edu.josecastillo.motrix.preview')
          PY

      - name: Compilar APK debug instalable
        working-directory: frontend/src-capacitor/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verificar identificador, firma y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          APK=frontend/src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep "^package:" | tee /tmp/motrix-preview-package.txt
          grep -q "name='bo.edu.josecastillo.motrix.preview'" /tmp/motrix-preview-package.txt
          "$SIGNER" verify --verbose "$APK"
          mkdir -p dist-preview
          cp "$APK" dist-preview/MOTRIX-Pruebas.apk
          sha256sum dist-preview/MOTRIX-Pruebas.apk > dist-preview/MOTRIX-Pruebas.apk.sha256

      - name: Publicar APK de pruebas para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MOTRIX-Pruebas-Android
          path: |
            dist-preview/MOTRIX-Pruebas.apk
            dist-preview/MOTRIX-Pruebas.apk.sha256
          if-no-files-found: error
          retention-days: 30
