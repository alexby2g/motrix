name: MOTRIX Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: https://backend.motrixbolivia.com/api
      VITE_REVERB_APP_KEY: motrix-pilot-key
      VITE_REVERB_HOST: backend.motrixbolivia.com
      VITE_REVERB_PORT: 443
      VITE_REVERB_SCHEME: https
      VITE_GOOGLE_CLIENT_ID: test.apps.googleusercontent.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build SPA
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, dom, gd, zip
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel test app
        working-directory: backend
        run: |
          mkdir -p storage/framework/views
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/cache/data
          mkdir -p bootstrap/cache
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear

      - name: Run test suite
        working-directory: backend
        run: php artisan test
