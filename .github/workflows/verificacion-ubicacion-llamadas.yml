name: Validar ubicacion y llamadas MOTRIX (sin generar APK)

on:
  push:
    branches:
      - mejora-profesional-ubicacion-llamadas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Comprobar formato del codigo
        working-directory: frontend
        run: npm run lint -- --no-fix
      - name: Probar resolucion de direcciones
        working-directory: frontend
        run: node --test tests/*.test.mjs
      - name: Compilar frontend sin generar APK
        working-directory: frontend
        run: npm run build
