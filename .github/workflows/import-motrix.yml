name: Import Motrix source

on:
  push:
    paths:
      - '.motrix-upload/manifest'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Motrix source
        shell: bash
        run: |
          set -euo pipefail
          cat .motrix-upload/part-* > /tmp/motrix-source.b64
          base64 --decode /tmp/motrix-source.b64 > /tmp/motrix-source.tar.gz
          tar -xzf /tmp/motrix-source.tar.gz -C .
          rm -rf .motrix-upload
          rm -f .github/workflows/import-motrix.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Preparar Motrix para Neon Render y Vercel"
          git push origin HEAD:main
