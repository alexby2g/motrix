name: Build MOTRIX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: motrix-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MOTRIX_VERSION_CODE: ${{ github.run_number }}
      MOTRIX_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar dependencias Quasar
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Instalar dependencias Capacitor
        working-directory: frontend/src-capacitor
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000

          for intento in 1 2 3; do
            echo "Intento npm ${intento}/3 para dependencias Capacitor"

            if npm ci --no-audit --no-fund; then
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "npm ci falló después de 3 intentos."
              exit 1
            fi

            echo "Descarga interrumpida. Limpiando instalación parcial y reintentando..."
            rm -rf node_modules || true
            sleep 12
          done

      - name: Crear plataforma Android
        working-directory: frontend/src-capacitor
        shell: bash
        run: |
          mkdir -p www

          if [ ! -f www/index.html ]; then
            printf '<!doctype html><html><body>MOTRIX</body></html>\n' > www/index.html
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generar icono y splash MOTRIX
        working-directory: frontend/src-capacitor
        shell: bash
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor '#176B2C' \
            --iconBackgroundColorDark '#0A2E0A' \
            --splashBackgroundColor '#176B2C' \
            --splashBackgroundColorDark '#0A2E0A' \
            --logoSplashScale 0.28

      - name: Compilar interfaz MOTRIX y sincronizar Capacitor
        working-directory: frontend
        run: npx quasar build -m capacitor -T android --skip-pkg

      - name: Configurar permisos y SDK Android
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend/src-capacitor/android')
          variables = root / 'variables.gradle'
          manifest = root / 'app/src/main/AndroidManifest.xml'

          text = variables.read_text(encoding='utf-8')

          text = re.sub(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 26',
              text
          )

          variables.write_text(
              text,
              encoding='utf-8'
          )

          xml = manifest.read_text(
              encoding='utf-8'
          )

          permisos = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />'
          ]

          faltantes = [
              linea
              for linea in permisos
              if linea not in xml
          ]

          if faltantes:
              match = re.search(
                  r'<manifest\b[^>]*>',
                  xml,
                  flags=re.DOTALL
              )

              if not match:
                  raise RuntimeError(
                      'No se encontró la etiqueta <manifest> en AndroidManifest.xml'
                  )

              cierre = match.end()

              xml = (
                  xml[:cierre]
                  + '\n    '
                  + '\n    '.join(faltantes)
                  + xml[cierre:]
              )

              manifest.write_text(
                  xml,
                  encoding='utf-8'
              )
          PY

      - name: Configurar Firebase Android
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOTRIX_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Falta el secret MOTRIX_GOOGLE_SERVICES_JSON_B64."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_B64" \
            | base64 --decode \
            > frontend/src-capacitor/android/app/google-services.json

          python3 <<'PY'
          import json
          from pathlib import Path

          archivo = Path(
              'frontend/src-capacitor/android/app/google-services.json'
          )

          data = json.loads(
              archivo.read_text(encoding='utf-8')
          )

          esperado = 'bo.edu.josecastillo.motrix'

          cliente_correcto = next(
              (
                  cliente
                  for cliente in data.get('client', [])
                  if cliente
                  .get('client_info', {})
                  .get('android_client_info', {})
                  .get('package_name') == esperado
              ),
              None
          )

          if cliente_correcto is None:
              raise RuntimeError(
                  f'google-services.json no corresponde a {esperado}'
              )

          project = data.get(
              'project_info',
              {}
          )

          api_keys = (
              cliente_correcto.get('api_key')
              or []
          )

          obligatorios = {
              'project_number': project.get('project_number'),
              'project_id': project.get('project_id'),
              'mobilesdk_app_id': (
                  cliente_correcto
                  .get('client_info', {})
                  .get('mobilesdk_app_id')
              ),
              'api_key': (
                  api_keys[0].get('current_key')
                  if api_keys
                  else None
              ),
          }

          faltantes = [
              clave
              for clave, valor in obligatorios.items()
              if not str(valor or '').strip()
          ]

          if faltantes:
              raise RuntimeError(
                  'google-services.json incompleto. Faltan: '
                  + ', '.join(faltantes)
              )

          print(
              'Firebase Android configurado correctamente para '
              + esperado
          )
          PY

      - name: Validar Firebase antes de compilar
        working-directory: frontend/src-capacitor
        run: npm run firebase:check

      - name: Compilar APK debug instalable
        working-directory: frontend/src-capacitor/android
        shell: bash
        run: |
          chmod +x gradlew

          for intento in 1 2 3; do
            echo "Intento Gradle ${intento}/3"

            if ./gradlew assembleDebug --stacktrace; then
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "Gradle falló después de 3 intentos."
              exit 1
            fi

            echo "Descarga/compilación interrumpida."
            echo "Reintentando en 12 segundos..."
            sleep 12
          done

      - name: Verificar APK Android antes de publicar
        shell: bash
        run: |
          APK="frontend/src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          FIREBASE_VALUES="frontend/src-capacitor/android/app/build/generated/res/google-services/debug/values/values.xml"

          echo "=========================================="
          echo "VERIFICANDO APK MOTRIX"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se generó el APK esperado."
            exit 1
          fi

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: No se encontró aapt2:"
            echo "$AAPT2"
            exit 1
          fi

          echo
          echo "1. Verificando plugin Push Notifications..."

          unzip -p "$APK" assets/capacitor.plugins.json \
            > /tmp/motrix-capacitor-plugins.json

          grep -q '@capacitor/push-notifications' \
            /tmp/motrix-capacitor-plugins.json \
            || {
              echo "ERROR: El APK no contiene PushNotifications."
              exit 1
            }

          echo "PushNotifications OK"

          echo
          echo "2. Verificando recursos generados por Google Services..."

          if [ ! -f "$FIREBASE_VALUES" ]; then
            echo "ERROR: Google Services no generó values.xml."
            echo "Archivos generados encontrados:"

            find \
              frontend/src-capacitor/android/app/build/generated \
              -maxdepth 8 \
              -type f \
              2>/dev/null \
              || true

            exit 1
          fi

          grep -q 'google_app_id' "$FIREBASE_VALUES" \
            || {
              echo "ERROR: values.xml no contiene google_app_id."
              cat "$FIREBASE_VALUES"
              exit 1
            }

          echo "google_app_id generado por Firebase OK"

          echo
          echo "3. Verificando recursos Firebase dentro del APK..."

          "$AAPT2" dump resources "$APK" \
            > /tmp/motrix-resources.txt

          grep -q 'google_app_id' \
            /tmp/motrix-resources.txt \
            || {
              echo "ERROR: El APK compilado no contiene google_app_id."
              exit 1
            }

          echo "google_app_id dentro del APK OK"

          echo
          echo "4. Verificando package y permisos Android..."

          "$AAPT2" dump badging "$APK" \
            > /tmp/motrix-badging.txt

          grep -q "package: name='bo.edu.josecastillo.motrix'" \
            /tmp/motrix-badging.txt \
            || {
              echo "ERROR: El package Android no corresponde a MOTRIX."
              cat /tmp/motrix-badging.txt
              exit 1
            }

          "$AAPT2" dump permissions "$APK" \
            > /tmp/motrix-permissions.txt

          grep -q 'android.permission.POST_NOTIFICATIONS' \
            /tmp/motrix-permissions.txt \
            || {
              echo "ERROR: El APK no contiene POST_NOTIFICATIONS."
              cat /tmp/motrix-permissions.txt
              exit 1
            }

          echo "POST_NOTIFICATIONS OK"

          echo
          echo "=========================================="
          echo "APK MOTRIX VERIFICADO CORRECTAMENTE"
          echo "PushNotifications: OK"
          echo "Firebase google_app_id: OK"
          echo "POST_NOTIFICATIONS: OK"
          echo "Package MOTRIX: OK"
          echo "=========================================="

      - name: Preparar APK final
        shell: bash
        run: |
          mkdir -p dist-apk

          cp \
            frontend/src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk \
            dist-apk/MOTRIX-Android-debug.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MOTRIX-Android-APK
          path: dist-apk/MOTRIX-Android-debug.apk
          if-no-files-found: error
          retention-days: 30