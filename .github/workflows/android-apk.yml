name: Build MOTRIX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - release-piloto-motrix
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: motrix-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Verificar secrets de firma
        shell: bash
        env:
          MOTRIX_KEYSTORE_B64: ${{ secrets.MOTRIX_KEYSTORE_B64 }}
          MOTRIX_KEYSTORE_PASSWORD: ${{ secrets.MOTRIX_KEYSTORE_PASSWORD }}
          MOTRIX_KEY_PASSWORD: ${{ secrets.MOTRIX_KEY_PASSWORD }}
        run: |
          if [ -z "$MOTRIX_KEYSTORE_B64" ]; then
            echo "Falta MOTRIX_KEYSTORE_B64"
            exit 1
          fi

          if [ -z "$MOTRIX_KEYSTORE_PASSWORD" ]; then
            echo "Falta MOTRIX_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "$MOTRIX_KEY_PASSWORD" ]; then
            echo "Falta MOTRIX_KEY_PASSWORD"
            exit 1
          fi

          echo "Secrets de firma disponibles."

      - name: Reconstruir keystore MOTRIX
        shell: bash
        env:
          MOTRIX_KEYSTORE_B64: ${{ secrets.MOTRIX_KEYSTORE_B64 }}
          MOTRIX_KEYSTORE_PASSWORD: ${{ secrets.MOTRIX_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/motrix-signing"

          printf '%s' "$MOTRIX_KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/motrix-signing/motrix-release-key.jks"

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/motrix-signing/motrix-release-key.jks" \
            -storepass "$MOTRIX_KEYSTORE_PASSWORD" \
            -alias motrix \
            >/dev/null

          echo "Keystore MOTRIX reconstruido y verificado."

      - name: Instalar dependencias Quasar
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Instalar dependencias Capacitor
        working-directory: frontend/src-capacitor
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000

          for intento in 1 2 3; do
            echo "Intento npm ${intento}/3"

            if npm install --no-audit --no-fund; then
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              exit 1
            fi

            rm -rf node_modules/sharp node_modules/@img || true
            sleep 12
          done

      - name: Crear plataforma Android si falta
        working-directory: frontend/src-capacitor
        shell: bash
        run: |
          mkdir -p www

          if [ ! -f www/index.html ]; then
            printf '<!doctype html><html><body>MOTRIX</body></html>\n' \
              > www/index.html
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generar icono y splash MOTRIX
        working-directory: frontend/src-capacitor
        shell: bash
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor '#029037' \
            --iconBackgroundColorDark '#029037' \
            --splashBackgroundColor '#029037' \
            --splashBackgroundColorDark '#029037' \
            --logoSplashScale 0.28

      - name: Compilar frontend y sincronizar Capacitor
        working-directory: frontend
        env:
          VITE_API_URL: https://backend.motrixbolivia.com/api
          VITE_REVERB_HOST: backend.motrixbolivia.com
        run: |
          npx quasar build \
            -m capacitor \
            -T android \
            --skip-pkg

      - name: Configurar permisos Android
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend/src-capacitor/android')
          variables = root / 'variables.gradle'
          manifest = root / 'app/src/main/AndroidManifest.xml'

          text = variables.read_text(encoding='utf-8')
          text = re.sub(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 26',
              text
          )
          variables.write_text(text, encoding='utf-8')

          xml = manifest.read_text(encoding='utf-8')

          permisos = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />'
          ]

          faltantes = [
              linea
              for linea in permisos
              if linea not in xml
          ]

          if faltantes:
              match = re.search(
                  r'<manifest\b[^>]*>',
                  xml,
                  flags=re.DOTALL
              )

              if not match:
                  raise RuntimeError(
                      'No se encontró la etiqueta <manifest>'
                  )

              cierre = match.end()

              xml = (
                  xml[:cierre]
                  + '\n    '
                  + '\n    '.join(faltantes)
                  + xml[cierre:]
              )

              manifest.write_text(
                  xml,
                  encoding='utf-8'
              )
          PY

      - name: Compilar APK release
        working-directory: frontend/src-capacitor/android
        shell: bash
        run: |
          chmod +x gradlew

          for intento in 1 2 3; do
            echo "Intento Gradle ${intento}/3"

            if ./gradlew assembleRelease --stacktrace; then
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              exit 1
            fi

            sleep 12
          done

      - name: Compilar AAB Google Play
        working-directory: frontend/src-capacitor/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Localizar y firmar AAB Google Play
        shell: bash
        env:
          MOTRIX_KEYSTORE_PASSWORD: ${{ secrets.MOTRIX_KEYSTORE_PASSWORD }}
          MOTRIX_KEY_PASSWORD: ${{ secrets.MOTRIX_KEY_PASSWORD }}
        run: |
          AAB_RELEASE="$(
            find frontend/src-capacitor/android/app/build/outputs/bundle/release \
              -maxdepth 1 \
              -type f \
              -name '*.aab' \
              | head -n 1
          )"

          if [ -z "$AAB_RELEASE" ]; then
            echo "No se encontró el AAB release."
            exit 1
          fi

          mkdir -p dist-aab

          cp "$AAB_RELEASE" dist-aab/MOTRIX.aab

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/motrix-signing/motrix-release-key.jks" \
            -storepass "$MOTRIX_KEYSTORE_PASSWORD" \
            -keypass "$MOTRIX_KEY_PASSWORD" \
            dist-aab/MOTRIX.aab \
            motrix

      - name: Verificar firma AAB Google Play
        shell: bash
        run: |
          jarsigner \
            -verify \
            -verbose \
            -certs \
            dist-aab/MOTRIX.aab

      - name: Generar SHA256 AAB
        shell: bash
        run: |
          sha256sum dist-aab/MOTRIX.aab \
            > dist-aab/MOTRIX.aab.sha256

      - name: Publicar AAB Google Play
        uses: actions/upload-artifact@v4
        with:
          name: MOTRIX-Google-Play
          path: |
            dist-aab/MOTRIX.aab
            dist-aab/MOTRIX.aab.sha256
          if-no-files-found: error

      - name: Localizar APK release
        shell: bash
        run: |
          APK_RELEASE="$(
            find frontend/src-capacitor/android/app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK_RELEASE" ]; then
            echo "No se encontró la APK release."
            exit 1
          fi

          echo "APK_RELEASE=$APK_RELEASE" >> "$GITHUB_ENV"
          echo "APK release encontrada."

      - name: Firmar APK oficial MOTRIX
        shell: bash
        env:
          MOTRIX_KEYSTORE_PASSWORD: ${{ secrets.MOTRIX_KEYSTORE_PASSWORD }}
          MOTRIX_KEY_PASSWORD: ${{ secrets.MOTRIX_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          mkdir -p dist-apk

          "$BUILD_TOOLS/zipalign" \
            -f \
            -v \
            4 \
            "$APK_RELEASE" \
            dist-apk/MOTRIX-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/motrix-signing/motrix-release-key.jks" \
            --ks-key-alias motrix \
            --ks-pass env:MOTRIX_KEYSTORE_PASSWORD \
            --key-pass env:MOTRIX_KEY_PASSWORD \
            --out dist-apk/MOTRIX.apk \
            dist-apk/MOTRIX-aligned.apk

          rm -f dist-apk/MOTRIX-aligned.apk

      - name: Verificar firma APK
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            dist-apk/MOTRIX.apk

          "$BUILD_TOOLS/zipalign" \
            -c \
            -v \
            4 \
            dist-apk/MOTRIX.apk

      - name: Generar SHA256 APK
        shell: bash
        run: |
          sha256sum dist-apk/MOTRIX.apk \
            > dist-apk/MOTRIX.apk.sha256

      - name: Publicar APK oficial
        uses: actions/upload-artifact@v4
        with:
          name: MOTRIX-Android-Release
          path: |
            dist-apk/MOTRIX.apk
            dist-apk/MOTRIX.apk.sha256
          if-no-files-found: error
          retention-days: 30