name: Validar rediseño móvil y chat MOTRIX

on:
  pull_request:
    branches:
      - oficial-motrix-v1-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Vue / Quasar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Lint de las pantallas modificadas
        working-directory: frontend
        run: npx eslint -c ./eslint.config.js src/components/ViajeChat.vue src/pages/pasajeros/SolicitarViajePage.vue src/pages/pasajeros/PerfilPasajeroPage.vue src/pages/pasajeros/PanelPasajeroPage.vue src/pages/servicios/ConductorPage.vue src/layouts/MainLayout.vue src/utils/mapaMotrix.js src/utils/mapaNativoCapacitor.js
      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Sintaxis PHP de chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar rutas y controlador con PHP del runner
        run: |
          php -v
          php -l backend/routes/api.php
          php -l backend/app/Http/Controllers/MensajeViajeController.php
